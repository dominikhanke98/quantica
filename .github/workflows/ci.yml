name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger, e.g. to run the slow tier on demand
  schedule:
    - cron: "0 6 * * 0" # weekly (Sun 06:00 UTC): the slow-tier full FI-EGF fit sweep

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy quantica

      # Excludes the QuantLib benchmarks and the slow tier (the ~2-3h O(n^2) FI-EGF fit sweep +
      # the ~20-40min sald P-profiling test, which run in the `slow` job on a weekly schedule /
      # manual dispatch). The per-push run keeps the full correctness proof: every
      # reconstruction-seam test + one representative fit per category are unmarked and run here.
      - name: Pytest (excludes QuantLib benchmarks and the slow tier)
        run: pytest --cov=quantica --cov-report=term-missing -m "not benchmark and not slow"

  docs:
    name: docstring coverage · API reference builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable, with docs extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # The docstring-coverage gate: fails if any public symbol lacks a docstring, so
      # the API reference (regenerated from those docstrings) can never drift incomplete.
      - name: Docstring coverage gate (interrogate)
        run: interrogate -v quantica apps

      # Regenerate the reference to prove the docstrings render without error (pdoc
      # rejects malformed docstrings). The committed docs/api/ is refreshed by the
      # author via `python scripts/build_docs.py` per CLAUDE.md §Documentation.
      - name: API reference builds
        run: python scripts/build_docs.py

  benchmark:
    name: benchmark vs QuantLib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable, with dev + benchmark extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark]"

      # Runs only the QuantLib cross-checks. Kept in a separate job so a
      # QuantLib packaging hiccup never blocks the core quality gate.
      - name: Pytest (benchmarks only)
        run: pytest -m benchmark

  slow:
    name: slow tier (full FI-EGF fit sweep)
    # Opt-in only: the exhaustive fits are O(n^2) and take ~2-3h, so they run weekly / on demand,
    # never on every push. The per-push `quality` job keeps the seams + representatives + P-profiling.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (slow tier only)
        run: pytest -m slow
